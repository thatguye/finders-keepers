<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Finders Keepers icon with two white stick figures running left">
  <!-- Pure Black Background -->
  <rect width="512" height="512" rx="112" fill="#000000"/>

  <!-- Runner 1 (Front, Left Side, Sprinting Left) -->
  <g transform="translate(34 148) scale(2.22)" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hollow circle head -->
    <circle cx="28" cy="14" r="9.5"/>
    <!-- Curved forward-leaning torso -->
    <path d="M34 23 L43 36 L48 47"/>
    <!-- Front arm bent upward to the left -->
    <path d="M34 23 L20 37 L9 21"/>
    <!-- Back arm trailing to the right -->
    <path d="M34 23 L51 24 L67 33"/>
    <!-- Front leg striding left with foot tick -->
    <path d="M48 47 L22 86 L18 82.5"/>
    <!-- Back leg kicked up behind with foot tick -->
    <path d="M48 47 L65 62 L83 48 L84.5 52.5"/>
  </g>

  <!-- Runner 2 (Chasing Behind, Right Side, Sprinting Left, Clearly Separated) -->
  <g transform="translate(264 148) scale(2.22)" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hollow circle head -->
    <circle cx="28" cy="14" r="9.5"/>
    <!-- Curved forward-leaning torso -->
    <path d="M34 23 L43 36 L48 47"/>
    <!-- Front arm bent upward to the left -->
    <path d="M34 23 L20 37 L9 21"/>
    <!-- Back arm trailing to the right -->
    <path d="M34 23 L51 24 L67 33"/>
    <!-- Front leg striding left with foot tick -->
    <path d="M48 47 L22 86 L18 82.5"/>
    <!-- Back leg kicked up behind with foot tick -->
    <path d="M48 47 L65 62 L83 48 L84.5 52.5"/>
  </g>
</svg>
